name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX + clang (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev libclang-dev pkg-config

      # Some hosted runners expose a Mellanox/RDMA device whose verbs calls fail
      # (`ibv_create_srq() failed: Operation not supported`), which makes every
      # worker creation fail with UCS_ERR_IO_ERROR. The tests only need self/shm/tcp.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context

  msrv:
    name: MSRV (Rust 1.78)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78 (rust-version in Cargo.toml)
        uses: dtolnay/rust-toolchain@1.78

      - name: Install UCX
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev

      - name: check
        run: cargo check --locked --all-targets

  rma_smoke:
    name: RMA smoke test (self TLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install UCX
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev

      - name: Build the RMA test
        run: cargo test --locked --lib --no-run

      # The test prints the UCX version and UCX_TLS in its failure messages; UCX writes
      # its debug log (transport selection) to the file so the test output stays readable.
      - name: Run the RMA put/get loopback test with UCX_TLS=self
        shell: bash -eo pipefail {0}
        env:
          UCX_TLS: self
          UCX_LOG_LEVEL: debug
          UCX_LOG_FILE: /tmp/ucx_rma_smoke.log
          RUST_BACKTRACE: 1
        run: |
          cargo test --locked --lib rma::ep_ops::tests::rma_self_put_get_round_trip -- --exact --test-threads=1 --nocapture 2>&1 | tee /tmp/rma_smoke.out
          grep -q "test result: ok. 1 passed" /tmp/rma_smoke.out

      - name: Show the UCX log
        if: always()
        run: tail -n 80 /tmp/ucx_rma_smoke.log || echo "no UCX log written"

  tier1-ucx-122:
    name: Tier 1 (UCX 1.22.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mlx5dv.h ships in libibverbs-dev on Ubuntu 24.04 (there is no libmlx5-dev package).
      # UCX's configure has no --enable-mlx5/--enable-ibverbs/--enable-rdmacm switches; the
      # verbs, mlx5 and rdmacm transports are detected automatically (--with-* to force them).
      - name: Install UCX 1.22.0 from source
        shell: bash -eo pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libnuma-dev librdmacm-dev libibverbs-dev
          cd /tmp
          wget -q https://github.com/openucx/ucx/releases/download/v1.22.0/ucx-1.22.0.tar.gz
          echo "258941cddd14ca60d38c0d31b9b09ec1052c901086841011a498da8b55a3cb24  ucx-1.22.0.tar.gz" | sha256sum -c -
          tar -xzf ucx-1.22.0.tar.gz
          cd ucx-1.22.0
          ./configure --prefix=/opt/ucx-1.22.0 --without-java --without-go
          make -j"$(nproc)"
          sudo make install

      - name: Set UCX_PREFIX to 1.22.0
        run: echo "UCX_PREFIX=/opt/ucx-1.22.0" >> "$GITHUB_ENV"

      # See Tier 0: avoid a runner's non-functional RDMA device.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context
