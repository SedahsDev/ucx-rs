name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX 1.20 + clang (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config autotools-dev
          # Install UCX 1.20 from source since apt has older version
          git clone --depth 1 --branch v1.20.0 https://github.com/openucx/ucx.git
          cd ucx
          ./autogen.sh
          ./configure --prefix=/usr --disable-rc --disable-dc --disable-mt --disable-verbs --disable-cma --disable-vec --disable-ffi
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        working-directory: /home/runner/work/ucx-rs/ucx-rs

      # Some hosted runners expose a Mellanox/RDMA device whose verbs calls fail
      # (`ibv_create_srq() failed: Operation not supported`), which makes every
      # worker creation fail with UCS_ERR_IO_ERROR. The tests only need self/shm/tcp.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context

  msrv:
    name: MSRV (Rust 1.78)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78 (rust-version in Cargo.toml)
        uses: dtolnay/rust-toolchain@1.78

      - name: Install UCX 1.20
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config autotools-dev
          # Install UCX 1.20 from source since apt has older version
          git clone --depth 1 --branch v1.20.0 https://github.com/openucx/ucx.git
          cd ucx
          ./autogen.sh
          ./configure --prefix=/usr --disable-rc --disable-dc --disable-mt --disable-verbs --disable-cma --disable-vec --disable-ffi
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        working-directory: /home/runner/work/ucx-rs/ucx-rs

      - name: check
        run: cargo check --locked --all-targets

  rma_smoke:
    name: RMA smoke test (self TLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install UCX
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev

      - name: Build the RMA test
        run: cargo test --locked --lib --no-run

      # The test prints the UCX version and UCX_TLS in its failure messages; UCX writes
      # its debug log (transport selection) to the file so the test output stays readable.
      - name: Run the RMA put/get loopback test with UCX_TLS=self
        shell: bash -eo pipefail {0}
        env:
          UCX_TLS: self
          UCX_LOG_LEVEL: debug
          UCX_LOG_FILE: /tmp/ucx_rma_smoke.log
          RUST_BACKTRACE: 1
        run: |
          cargo test --locked --lib rma::ep_ops::tests::rma_self_put_get_round_trip -- --exact --test-threads=1 --nocapture 2>&1 | tee /tmp/rma_smoke.out
          grep -q "test result: ok. 1 passed" /tmp/rma_smoke.out

      # #209: the owned-data model end to end (many op kinds, one shared
      # progress loop, subset cancel, flush, close) on the self transport.
      - name: Run the owned_pipeline example with UCX_TLS=self
        env:
          UCX_TLS: self
          RUST_BACKTRACE: 1
        run: cargo run --locked --example owned_pipeline

      - name: Show the UCX log
        if: always()
        run: tail -n 80 /tmp/ucx_rma_smoke.log || echo "no UCX log written"

  tier1-ucx-122:
    name: Tier 1 (UCX 1.22.0, bindgen + version guard)
    runs-on: ubuntu-24.04
    env:
      # Regenerate bindings with bindgen against the real 1.22.0 headers instead
      # of compiling the committed src/bindings.rs, and run build.rs's UCX
      # version guard (#132). Both are fatal under this flag: an unsupported
      # version or a bindgen failure fails the build. Every cargo step below
      # (clippy, test, example) builds and tests against the fresh bindings.
      UCX_GENERATE_BINDINGS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mlx5dv.h ships in libibverbs-dev on Ubuntu 24.04 (there is no libmlx5-dev package).
      # UCX's configure has no --enable-mlx5/--enable-ibverbs/--enable-rdmacm switches; the
      # verbs, mlx5 and rdmacm transports are detected automatically (--with-* to force them).
      - name: Install UCX 1.22.0 from source
        shell: bash -eo pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libnuma-dev librdmacm-dev libibverbs-dev
          cd /tmp
          wget -q https://github.com/openucx/ucx/releases/download/v1.22.0/ucx-1.22.0.tar.gz
          echo "258941cddd14ca60d38c0d31b9b09ec1052c901086841011a498da8b55a3cb24  ucx-1.22.0.tar.gz" | sha256sum -c -
          tar -xzf ucx-1.22.0.tar.gz
          cd ucx-1.22.0
          ./configure --prefix=/opt/ucx-1.22.0 --without-java --without-go
          make -j"$(nproc)"
          sudo make install

      - name: Set UCX_PREFIX to 1.22.0
        run: echo "UCX_PREFIX=/opt/ucx-1.22.0" >> "$GITHUB_ENV"

      # See Tier 0: avoid a runner's non-functional RDMA device.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      # Proves the bindgen path and the version guard ran in this job: build.rs
      # prints both lines only after the guard passed and bindgen succeeded.
      - name: bindgen + version guard (UCX 1.22 headers)
        shell: bash -eo pipefail {0}
        run: |
          cargo build --locked 2>&1 | tee /tmp/bindgen_build.log
          grep -F "UCX version 1.22 (/opt/ucx-1.22.0/include/ucp/api/ucp_version.h) is within supported range (1.19, 1.22)" /tmp/bindgen_build.log
          grep -F "bindgen succeeded" /tmp/bindgen_build.log

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context

      # Negative test: headers that claim UCX 1.16 (below the 1.19 minimum)
      # must fail the build in the guard, before bindgen runs. Last step on
      # purpose: changing UCX_PREFIX reruns build.rs for the shared target dir.
      - name: version guard rejects UCX 1.16 headers
        shell: bash -o pipefail {0}
        run: |
          fake=/tmp/fake-ucx-1.16
          mkdir -p "$fake/include/ucp/api" "$fake/lib"
          printf '#define UCP_API_MAJOR    1\n#define UCP_API_MINOR    16\n' > "$fake/include/ucp/api/ucp_version.h"
          if UCX_PREFIX="$fake" cargo check --locked > /tmp/guard.log 2>&1; then
            cat /tmp/guard.log
            echo "::error::build.rs accepted UCX 1.16 headers"
            exit 1
          fi
          cat /tmp/guard.log
          grep -F "UCX version 1.16" /tmp/guard.log
          grep -F "but minimum supported is 1.19" /tmp/guard.log
