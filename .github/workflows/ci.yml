name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX 1.20 + clang (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config autotools-dev
          # Install UCX 1.20 from source since apt has older version
          git clone --depth 1 --branch v1.20.0 https://github.com/openucx/ucx.git
          cd ucx
          ./autogen.sh
          ./configure --prefix=/usr --disable-rc --disable-dc --disable-mt --disable-verbs --disable-cma --disable-vec --disable-ffi
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        working-directory: /home/runner/work/ucx-rs/ucx-rs

      # Some hosted runners expose a Mellanox/RDMA device whose verbs calls fail
      # (`ibv_create_srq() failed: Operation not supported`), which makes every
      # worker creation fail with UCS_ERR_IO_ERROR. The tests only need self/shm/tcp.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context

  msrv:
    name: MSRV (Rust 1.78)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78 (rust-version in Cargo.toml)
        uses: dtolnay/rust-toolchain@1.78

      - name: Install UCX 1.20
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config autotools-dev
          # Install UCX 1.20 from source since apt has older version
          git clone --depth 1 --branch v1.20.0 https://github.com/openucx/ucx.git
          cd ucx
          ./autogen.sh
          ./configure --prefix=/usr --disable-rc --disable-dc --disable-mt --disable-verbs --disable-cma --disable-vec --disable-ffi
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        working-directory: /home/runner/work/ucx-rs/ucx-rs

      - name: check
        run: cargo check --locked --all-targets

  rma_smoke:
    name: RMA smoke test (UCX 1.20.0, self TLS)
    runs-on: ubuntu-24.04
    env:
      # Inside the supported range (build.rs: 1.19 through 1.22). Ubuntu 24.04's
      # apt libucx-dev is 1.16.0, below it (#113, #131).
      UCX_VER: 1.20.0
      UCX_SHA256: 7c8a6093cada179aa1d851b83625e3b25ed5658966e309de5118c27a038c7ef9
      # Bump when the configure flags below change, so a stale build is not restored.
      UCX_BUILD_REV: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # The cache step restores into /opt as the runner user, so the prefix must
      # exist and be owned by it first.
      - name: Prepare the UCX prefix
        run: |
          sudo mkdir -p "/opt/ucx-$UCX_VER"
          sudo chown "$(id -u):$(id -g)" "/opt/ucx-$UCX_VER"

      - name: Cache UCX ${{ env.UCX_VER }}
        id: ucx-cache
        uses: actions/cache@v4
        with:
          path: /opt/ucx-${{ env.UCX_VER }}
          key: ucx-${{ runner.os }}-${{ runner.arch }}-${{ env.UCX_VER }}-${{ env.UCX_SHA256 }}-rev${{ env.UCX_BUILD_REV }}

      # Built without optional external libraries (verbs, rdmacm, numa, cuda, ...)
      # so the cached install has no runtime dependency beyond libc and does not
      # break when the runner image changes. The smoke test only needs `self`.
      - name: Build UCX ${{ env.UCX_VER }} from source (cache miss)
        if: steps.ucx-cache.outputs.cache-hit != 'true'
        shell: bash -eo pipefail {0}
        run: |
          cd /tmp
          wget -q "https://github.com/openucx/ucx/releases/download/v${UCX_VER}/ucx-${UCX_VER}.tar.gz"
          echo "${UCX_SHA256}  ucx-${UCX_VER}.tar.gz" | sha256sum -c -
          tar -xzf "ucx-${UCX_VER}.tar.gz"
          cd "ucx-${UCX_VER}"
          ./configure --prefix="/opt/ucx-${UCX_VER}" --without-java --without-go \
            --without-cuda --without-rocm --without-verbs --without-rdmacm \
            --without-knem --without-xpmem --without-fuse3 --disable-doxygen-doc
          make -j"$(nproc)"
          make install

      - name: Set UCX_PREFIX to ${{ env.UCX_VER }}
        run: echo "UCX_PREFIX=/opt/ucx-$UCX_VER" >> "$GITHUB_ENV"

      # Fail fast if the restored or built install is not the expected version.
      # build.rs adds an rpath to $UCX_PREFIX/lib, so the test binaries load this
      # install, not a system libucx.
      - name: Check the UCX version
        shell: bash -eo pipefail {0}
        run: |
          "$UCX_PREFIX/bin/ucx_info" -v | tee /tmp/ucx_info.txt
          grep -q "Library version: ${UCX_VER}" /tmp/ucx_info.txt

      - name: Build the RMA test
        run: cargo test --locked --lib --no-run

      # The test prints the UCX version and UCX_TLS in its failure messages; UCX writes
      # its debug log (transport selection) to the file so the test output stays readable.
      - name: Run the RMA put/get loopback test with UCX_TLS=self
        shell: bash -eo pipefail {0}
        env:
          UCX_TLS: self
          UCX_LOG_LEVEL: debug
          UCX_LOG_FILE: /tmp/ucx_rma_smoke.log
          RUST_BACKTRACE: 1
        run: |
          cargo test --locked --lib rma::ep_ops::tests::rma_self_put_get_round_trip -- --exact --test-threads=1 --nocapture 2>&1 | tee /tmp/rma_smoke.out
          grep -q "test result: ok. 1 passed" /tmp/rma_smoke.out

      # #209: the owned-data model end to end (many op kinds, one shared
      # progress loop, subset cancel, flush, close) on the self transport.
      - name: Run the owned_pipeline example with UCX_TLS=self
        env:
          UCX_TLS: self
          RUST_BACKTRACE: 1
        run: cargo run --locked --example owned_pipeline

      - name: Show the UCX log
        if: always()
        run: tail -n 80 /tmp/ucx_rma_smoke.log || echo "no UCX log written"

  tier1-ucx-122:
    name: Tier 1 (UCX 1.22.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mlx5dv.h ships in libibverbs-dev on Ubuntu 24.04 (there is no libmlx5-dev package).
      # UCX's configure has no --enable-mlx5/--enable-ibverbs/--enable-rdmacm switches; the
      # verbs, mlx5 and rdmacm transports are detected automatically (--with-* to force them).
      - name: Install UCX 1.22.0 from source
        shell: bash -eo pipefail {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libnuma-dev librdmacm-dev libibverbs-dev
          cd /tmp
          wget -q https://github.com/openucx/ucx/releases/download/v1.22.0/ucx-1.22.0.tar.gz
          echo "258941cddd14ca60d38c0d31b9b09ec1052c901086841011a498da8b55a3cb24  ucx-1.22.0.tar.gz" | sha256sum -c -
          tar -xzf ucx-1.22.0.tar.gz
          cd ucx-1.22.0
          ./configure --prefix=/opt/ucx-1.22.0 --without-java --without-go
          make -j"$(nproc)"
          sudo make install

      - name: Set UCX_PREFIX to 1.22.0
        run: echo "UCX_PREFIX=/opt/ucx-1.22.0" >> "$GITHUB_ENV"

      # See Tier 0: avoid a runner's non-functional RDMA device.
      - name: Disable UCX InfiniBand transports
        run: echo "UCX_TLS=^ib" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked -- --test-threads=1

      - name: example
        run: cargo run --locked --example version_and_context
