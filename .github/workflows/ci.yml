name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tier0:
    name: Tier 0 (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX + clang (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev libclang-dev pkg-config

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test -- --test-threads=1

      - name: example
        run: cargo run --example version_and_context

  rma_amo_smoke:
    name: RMA/AMO smoke test (self TLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX
        run: |
          sudo apt-get update
          sudo apt-get install -y libucx-dev

      - name: Run RMA/AMO smoke test with debug logging
        run: |
          export UCX_TLS=self
          export UCX_LOG_LEVEL=debug
          echo "UCX_TLS=$UCX_TLS"
          echo "UCX_LOG_LEVEL=$UCX_LOG_LEVEL"
          cargo test -- rma_amo_self --ignored --nocapture 2>&1 | tee /tmp/ucx_rma_amo.log
          if grep -q "using.*self" /tmp/ucx_rma_amo.log; then
            echo "✅ Confirmed: UCX selected 'self' transport"
          else
            echo "⚠️ Warning: 'self' transport not confirmed in logs"
            echo "=== UCX log excerpt ==="
            tail -n 50 /tmp/ucx_rma_amo.log
            echo "========================"
          fi
        env:
          RUST_BACKTRACE: 1

      - name: Document ignored RMA/AMO test
        run: |
          echo "If the RMA/AMO test fails or is ignored, it is expected on GitHub-hosted runners where self TLS RMA/AMO may be unsupported."
          echo "See THREADING.md for details."
        if: always()

  tier1-ucx-122:
    name: Tier 1 (UCX 1.22.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UCX 1.22.0 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libnuma-dev libmlx5-dev librdmacm-dev libibverbs-dev
          cd /tmp
          wget -q https://github.com/openucx/ucx/releases/download/v1.22.0/ucx-1.22.0.tar.gz
          tar -xzf ucx-1.22.0.tar.gz
          cd ucx-1.22.0
          ./configure --prefix=/opt/ucx-1.22.0 --enable-mlx5 --enable-rdmacm --enable-ibverbs
          make -j$(nproc)
          sudo make install

      - name: Set UCX_PREFIX to 1.22.0
        run: echo "UCX_PREFIX=/opt/ucx-1.22.0" >> $GITHUB_ENV

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: example
        run: cargo run --example version_and_context